name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer "cython>=3.0.10" virtualenv setuptools
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Extraer error
        if: always()
        run: |
          grep -n -i -E "error|failed|exception|traceback" build.log | tail -n 40 > error_resumen.txt || true
          tail -n 120 build.log > error_final.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            error_resumen.txt
            error_final.txt
      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: echo-knight-apk
          path: bin/*.apk
